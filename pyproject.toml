[project]
name = "hrm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.7.0",
  "torchvision>=0.22.0",
  "adam-atan2-pytorch",
  "einops",
  "tqdm",
  "coolname",
  "pydantic",
  "argdantic",
  "wandb",
  "omegaconf",
  "hydra-core",
  "huggingface_hub",
  "psutil",
  "packaging",
  "ninja",
  "wheel",
  "setuptools",
  "setuptools-scm",
  "flash-attn",
  "numpy>=2.3.4",
]


[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = [
    "torch>=2.7.0", 
    "torchvision>=0.22.0"
    ]

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

[tool.setuptools.packages.find]
exclude = ["config*", "assets*", "models*", "dataset*", "utils*"]

[project.scripts]
build-sudoku = "hrm.main:build_sudoku"
train-sudoku = "hrm.main:train_sudoku"
